# Typecheck, test, build and a production audit on every pull request and on main, then a deploy from main.
# A run on main is never canceled, so a deploy cannot stop halfway. wrangler.jsonc is not committed (public
# repo, it carries the D1 id): the checks run on the .example, and the deploy writes the id in from a variable.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: cp wrangler.jsonc.example wrangler.jsonc && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Raw console.* calls in server code may not rise above .console.json's baseline (devkit-console; the logger is
      # site-runtime ./log), and a migration in drizzle/ is never edited, renamed or deleted, and a new one only adds
      # unless it says `-- contract: <reason>` (devkit-migrations, drizzle/manifest.json).
      - name: Console ratchet
        run: npm run --silent check:console

      - name: Migrations are expand-only
        run: npm run --silent check:migrations

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # A merge to main deploys once CI is green: migrations first, then the Worker. Dormant until the repo
  # variable CF_DEPLOY is 'true' (with D1_DATABASE_ID set, and the secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID), so nothing deploys before the Cloudflare cutover.
  # devkit's shared deploy (worker-deploy.yml): it reads the D1 Time Travel bookmark (`d1-database`), so a bad migration is
  # one restore to undo, then writes the D1 id into the config, applies the pending migrations that only add
  # (devkit-migrations --apply; a drop, rename or row delete waits for a hand run) and builds,
  # deploys with DEPLOY_SHA set to this commit, waits for /health to report it, checks the home page answers, and rolls
  # the deploy back if it does not. A rollback never undoes a migration.
  # On main: a gradual rollout (D4), the new version on 10% of traffic for 10 minutes before the live gate judges it and
  # it takes all traffic. On a pull request from this repository: a preview version only (pr-<number>, D6), its URL in
  # the run summary, nothing deployed and no migration run.
  deploy:
    needs: ci
    if: >-
      vars.CF_DEPLOY == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request')
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'deploy' }}
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@db347b70932b52b427b120ee1419d4614d5e4c29 # v0.20.20
    with:
      worker-name: julieedwards
      d1-database: julieedwards
      health-url: https://julieedwards.info/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://julieedwards.info/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: >-
        sed -e "s|<D1_DATABASE_ID>|${{ vars.D1_DATABASE_ID }}|" wrangler.jsonc.example > wrangler.jsonc &&
        npx devkit-migrations drizzle --apply julieedwards &&
        npm run build
      sha-var: DEPLOY_SHA
      gradual-percent: 10
      gradual-minutes: 10
      preview: true
      preview-build: >-
        sed -e "s|<D1_DATABASE_ID>|${{ vars.D1_DATABASE_ID }}|" wrangler.jsonc.example > wrangler.jsonc &&
        npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
