# Typecheck, test, build and a production audit on every pull request and on main, then a deploy from main.
# A run on main is never canceled, so a deploy cannot stop halfway. wrangler.jsonc is not committed (public
# repo, it carries the D1 id): the checks run on the .example, and the deploy writes the id in from a variable.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: cp wrangler.jsonc.example wrangler.jsonc && npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # A merge to main deploys once CI is green: migrations first, then the Worker. Dormant until the repo
  # variable CF_DEPLOY is 'true' (with D1_DATABASE_ID set, and the secrets CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID), so nothing deploys before the Cloudflare cutover.
  # devkit's shared deploy (worker-deploy.yml): it writes the D1 id into the config, applies the migrations and builds,
  # deploys with DEPLOY_SHA set to this commit, waits for /health to report it, checks the home page answers, and rolls
  # the deploy back if it does not. A rollback never undoes a migration.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CF_DEPLOY == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@64997ae3facf4360eb676c57b7a5b5e8ec3350de # v0.18.0
    with:
      worker-name: julieedwards
      health-url: https://julieedwards.info/health
      verify-command: >-
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://julieedwards.info/ || true);
        echo "home page answered $code";
        if [ "$code" = 200 ]; then exit 0; elif [ "$code" = 000 ]; then exit 3; else exit 1; fi
      pre-deploy: >-
        sed -e "s|<D1_DATABASE_ID>|${{ vars.D1_DATABASE_ID }}|" wrangler.jsonc.example > wrangler.jsonc &&
        npm run db:migrate:prod &&
        npm run build
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
